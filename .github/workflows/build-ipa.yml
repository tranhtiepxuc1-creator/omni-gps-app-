name: Build TrollStore GPS via Xcodebuild

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    # 🚀 CHIÊU ĐỘC: Nâng cấp máy ảo lên macOS 15 (Chạy Xcode 16 chính chủ Apple)
    runs-on: macos-15

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Chạy XcodeGen để đúc file dự án theo đúng chuẩn Xcode 16 (Format 77)
    - name: Generate Xcode Project using XcodeGen
      run: |
        brew install xcodegen
        xcodegen generate

    # Biên dịch Archive bằng Xcode 16 - khớp hoàn toàn mọi điều kiện
    - name: Build and Archive App via Xcode
      run: |
        xcodebuild archive \
          -project OmniGPS.xcodeproj \
          -scheme OmniGPS \
          -configuration Release \
          -archivePath ./build/OmniGPS.xcarchive \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    # Bơm đặc quyền hệ thống TrollStore và đóng gói
    - name: Inject TrollStore Entitlements & Package IPA
      run: |
        mkdir -p Payload
        cp -r ./build/OmniGPS.xcarchive/Products/Applications/OmniGPS.app Payload/
        codesign --force --sign - --entitlements Resources/Entitlements.plist Payload/OmniGPS.app
        zip -r OmniGPS_Xcode_TrollStore.ipa Payload

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: OmniGPS-Xcode-Edition
        path: OmniGPS_Xcode_TrollStore.ipa
