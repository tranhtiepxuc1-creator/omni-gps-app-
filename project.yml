name: OmniGPS
options:
  bundleIdPrefix: com.omni
  # Sử dụng cú pháp ép buộc định dạng file dự án tương thích Xcode 15 (Không cho tự nhảy lên 77)
  projectFormat: Xcode 15.0
targets:
  OmniGPS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - main.m
      - AppDelegate.h
      - AppDelegate.m
      - ViewController.h
      - ViewController.m
      - Resources
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        DONT_CODE_SIGN: YES
        INFOPLIST_FILE: Resources/Info.plist
        OTHER_LDFLAGS: -framework UIKit -framework UniformTypeIdentifiers -framework CoreLocation
