name: OmniGPS
# 🚀 FIX CHÍ MẠNG: Ép cấu trúc dự án xuất ra định dạng tương thích chính xác với Xcode 15 trên máy ảo
options:
  bundleIdPrefix: com.omni
  xcodeVersion: "15.0"
targets:
  OmniGPS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - main.m
      - AppDelegate.h
      - AppDelegate.m
      - ViewController.h
      - ViewController.m
      - Resources
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        DONT_CODE_SIGN: YES
        INFOPLIST_FILE: Resources/Info.plist
        OTHER_LDFLAGS: -framework UIKit -framework UniformTypeIdentifiers -framework CoreLocation
